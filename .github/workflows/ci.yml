name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore NextTech.sln

      - name: Verify formatting
        run: dotnet format NextTech.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build NextTech.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test NextTech.sln --configuration Release --no-build --verbosity normal

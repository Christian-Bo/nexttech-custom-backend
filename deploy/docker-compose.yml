services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nexttech-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - nexttech_sql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: nexttech-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      # SQL Server se sobrescribe aquí porque el hostname dentro de Docker es "sqlserver".
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=NextTechCustomDB;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;"

      # Por ahora Oracle se lee desde appsettings.json.
      # Más adelante puedes moverlo a .env descomentando:
      # ConnectionStrings__Oracle: ${ORACLE_CONNECTION}

      # También puedes mover JWT a .env después:
      # Jwt__Key: ${JWT_SECRET}

    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nexttech_sql_data:
